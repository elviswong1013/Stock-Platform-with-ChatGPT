[project]
name = "stock-platform-with-chatgpt"
version = "0.0.0"
description = "Stock Platform with ChatGPT"
requires-python = ">=3.10,<3.12"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0,<2.0.0",
  "matplotlib>=3.7.0,<3.9.0",
  "mplfinance>=0.12.10b0",
  "requests>=2.31.0",
  "beautifulsoup4>=4.12.0",
  "lxml>=4.9.0",
  "FinMind>=1.0.0",
  "scikit-learn>=1.3.0,<1.5.0",
  "ta>=0.10.0",
  "cmdstanpy>=1.1.0",
  "prophet==1.1.5"
]

[build-system]
requires = ["setuptools", "wheel"]
build-backend = "setuptools.build_meta"
